name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify modules
        run: go mod verify

      - name: Check formatting (Ubuntu)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mapfile -t go_files < <(git ls-files '*.go')
          files="$(gofmt -l "${go_files[@]}")"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$files"
            exit 1
          fi

      - name: Check formatting (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $goFiles = @(git ls-files "*.go")
          $files = @(gofmt -l $goFiles)
          if ($files.Count -ne 0) {
            Write-Error "The following files are not gofmt-formatted:`n$($files -join "`n")"
            exit 1
          }

      - name: Test
        run: go test ./...

      - name: Vet
        run: go vet ./...

      - name: Test without CGO
        env:
          CGO_ENABLED: "0"
        run: go test ./...

      - name: Build without CGO
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath ./cmd/bot

  race:
    name: Race detector (Ubuntu)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Run race detector
        run: go test -race ./...
